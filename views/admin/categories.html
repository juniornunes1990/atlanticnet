<div class="content-i">
<div class="content-box">
    <div class="element-wrapper">
    <h6 class="element-header">
        Categorias
    </h6>
    <div class="element-box">
        <h5 class="form-header">
        Todas categorias
        </h5>
        <div class="form-desc">
            Aqui você pode cadastrar gerenciar todas as categorias cadastradas no sistema ou adicionar, editar ou apaga-lás.
        </div>
        <div class="col-sm-6">
            <a class="btn btn-primary" style="margin-top: -30px;" href="{$BASE_URL}/admin/categories/create">Adicionar Categoria</a><br>
        </div>
        <div class="table-responsive">
        <table id="dataTable1" width="100%" class="table table-striped table-lightfont">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Data de Criação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tfoot>
                <tr>
                    <th>Nome</th>
                    <th>Data de Criação</th>
                    <th>Ações</th>
                </tr>
            </tfoot>
            <tbody>
                {loop="$categories"}
                <tr>
                    <td>{$value.descategory}</td>
                    <td>{$value.dtregister}</td>
                    <td width="10%" class="row-actions">
                        <a href="{$BASE_URL}/admin/categories/{$value.idcategory}"><i class="os-icon os-icon-ui-49"></i></a>
                        <a class="danger" href="{$BASE_URL}/admin/categories/{$value.idcategory}/delete"><i class="os-icon os-icon-ui-15"></i></a>
                      </td>
                </tr>
                {/loop}	
            </tbody>
        </table>
        </div>
    </div>
    </div>
</div>
</div>
